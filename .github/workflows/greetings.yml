name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to Json Studio! Thanks for opening your first issue. Whether it is a bug report, a feature idea, or general feedback, we appreciate you taking the time to share it. If possible, please include reproduction steps, expected and actual behavior, logs, or screenshots."
          pr-message: "Welcome to Json Studio! Thanks for your first pull request. Please ensure your PR title follows the Conventional Commits format (for example, feat:, fix:, docs:, or refactor:) and that the relevant checks pass locally."
